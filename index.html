<style>

*{box-sizing:border-box;margin:0}html{background:var(--bg)}body{background:var(--bg);color:var(--ink);font-family:'Noto Sans Thai',system-ui,sans-serif;font-size:14px}
[hidden]{display:none!important}svg{display:block}
.wm{font-family:Sora,sans-serif;font-weight:800;letter-spacing:-.03em}.wm i{font-style:normal;background:linear-gradient(#ff8a97,#ff2d46);-webkit-background-clip:text;background-clip:text;color:transparent}

.bl{position:absolute;border-radius:50%;opacity:.45;-webkit-mask-image:radial-gradient(circle,#000 0,transparent 68%);mask-image:radial-gradient(circle,#000 0,transparent 68%);animation:fl 10s ease-in-out infinite alternate;will-change:transform}@keyframes fl{to{transform:translate(70px,-50px) scale(1.25)}}

.lw h1{font-size:46px;margin-top:6px}.lw p{color:var(--mut);margin:4px 0 22px;font-weight:300}
.gl{background:#ffffff0d;border:1px solid #ffffff1f;border-radius:22px;padding:22px;backdrop-filter:blur(18px);box-shadow:0 30px 80px #000a,inset 0 1px 0 #ffffff22;text-align:left}
input,select{width:100%;padding:11px 13px;border:1px solid #ffffff22;border-radius:11px;background:#0b0e1a;color:var(--ink);font:inherit;margin-bottom:12px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--red);outline-offset:1px}
.btn{width:100%;padding:12px;border:0;border-radius:11px;background:linear-gradient(135deg,#ff4d63,#c01230);color:#fff;font:inherit;font-weight:600;cursor:pointer;transition:.2s}.btn:hover{transform:translateY(-1px);box-shadow:0 8px 26px #ff2d4666}.btn:disabled{opacity:.6}
.sh{animation:shk .4s}@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.er{color:#ff7a89;font-size:12px;min-height:16px;margin-bottom:8px}
#zm{position:fixed;z-index:50;will-change:transform}
#zm svg{width:100%;height:100%}
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:#0a0d18;border-right:1px solid var(--ln);padding:18px 12px;position:sticky;top:0;height:100vh}
.lo{display:flex;align-items:center;gap:8px;font-size:21px;padding:2px 10px 20px}.lo svg{width:34px}
.nv{display:flex;gap:10px;align-items:center;width:100%;padding:11px 13px;margin-bottom:4px;border:0;border-radius:12px;background:none;color:#b7bfd6;font:inherit;cursor:pointer;text-align:left;transition:.2s}
.nv:hover{background:#ffffff0f;transform:translateX(3px)}.nv.on{background:linear-gradient(135deg,#ff2d4633,#ff2d4614);color:#fff;box-shadow:inset 0 0 0 1px #ff2d4655}
main{padding:20px 28px;min-width:0}
.top{display:flex;justify-content:flex-end;gap:14px;align-items:center;color:var(--mut);font-size:12px}.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#ff4d63,#7c3aed);display:grid;place-items:center;color:#fff;font-weight:700}
h2.t{font-size:32px;font-weight:800;margin:8px 0 20px;letter-spacing:-.03em;background:linear-gradient(90deg,#fff,#ff9aa6);-webkit-background-clip:text;background-clip:text;color:transparent}
#pg{animation:fd .5s}@keyframes fd{from{opacity:0;transform:translateY(10px)}}
.g{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1.5fr 1fr}.gq{grid-template-columns:1fr 1fr}
.card{position:relative;background:radial-gradient(380px circle at var(--mx,50%) var(--my,-20%),#ff2d4624,transparent 65%),linear-gradient(160deg,#181d33dd,#10142add);border:1px solid #ffffff1a;border-radius:24px;padding:20px;min-width:0;box-shadow:0 18px 50px #0006,inset 0 1px 0 #ffffff1f;transition:border-color .3s,transform .3s;animation:fd .6s both}.card:hover{border-color:#ff2d4666}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(40% 35% at 88% 0%,#ff2d4630,transparent),radial-gradient(40% 40% at 0% 100%,#6d28d92e,transparent);animation:au 10s ease-in-out infinite alternate}@keyframes au{to{opacity:.55}}
body.zoom:before,body.zoom .bl{animation:none}
main,aside{position:relative;z-index:1}aside{position:sticky;z-index:2;background:#0a0d18}
.fw{animation:fwd 1s linear infinite}@keyframes fwd{to{stroke-dashoffset:-16}}
.card h3{font-size:14px;margin-bottom:12px;color:#c9cfdf;font-weight:600}
.st small{color:var(--mut);display:block}.st b{font-family:Sora,sans-serif;font-size:34px;letter-spacing:-.03em;background:linear-gradient(#fff,#ffb3bc);-webkit-background-clip:text;background-clip:text;color:transparent}.st div{font-size:12px;margin-top:2px}
.ok{color:var(--grn)}.bad{color:#ff6b7d}
.ln{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:1;animation:dr 1.6s ease forwards}@keyframes dr{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.dn{animation:dnu 1.2s ease both}@keyframes dnu{from{stroke-dasharray:0 251.3}}
table{width:100%;border-collapse:collapse;font-size:13px}th{color:var(--mut);font-weight:600;padding:9px;text-align:center;border-bottom:1px solid var(--ln)}td{padding:7px 9px;text-align:center;border-bottom:1px solid #ffffff0a}td:first-child,th:first-child{text-align:left}
tbody tr{animation:fd .5s both}tbody tr:hover{background:#ffffff08}
td input{width:62px;padding:6px;margin:0;text-align:center}td input.lw2{border-color:#ff2d46;color:#ff8a97;background:#2a0b14}
.row{display:grid;grid-template-columns:1fr 120px;gap:8px;align-items:center;margin-bottom:10px}.row select,.row input{margin:0}
.job{padding:9px 0;border-bottom:1px solid var(--ln);opacity:.4;transition:.4s}.job.on{opacity:1;color:#ffb3bc}.job.d{opacity:1;color:var(--grn)}
.pb{height:8px;background:#ffffff14;border-radius:8px;overflow:hidden;margin:12px 0 6px}.pb div{height:100%;width:0;background:linear-gradient(90deg,#7c8cff,#ff2d46);transition:width .2s}
.bars{display:flex;align-items:flex-end;justify-content:center;gap:14%;height:210px;border-bottom:1px solid var(--ln)}
.bar{width:90px;border-radius:12px 12px 0 0;transform-origin:bottom;animation:gr 1.2s cubic-bezier(.2,.8,.2,1) both;position:relative}@keyframes gr{from{transform:scaleY(0)}}.bar b{position:absolute;top:-22px;width:100%;text-align:center}
.tg{width:44px;height:25px;border-radius:13px;background:#3a4160;position:relative;cursor:pointer;border:0;transition:.25s}.tg:after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.25s}.tg.on{background:var(--red)}.tg.on:after{left:22px}
.kv{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}.kv>span:first-child{color:var(--mut)}
.pu{fill:#4da3ff;transform-box:fill-box;transform-origin:center;animation:ps 2.2s ease-out infinite}@keyframes ps{from{transform:scale(1);opacity:.8}to{transform:scale(3);opacity:0}}
.rt{fill:none;stroke:var(--red);stroke-linecap:round;opacity:.8;stroke-dasharray:1;animation:dr 1.2s ease forwards}
.toast{position:fixed;bottom:22px;right:22px;background:#1d2340;border:1px solid #ffffff22;padding:12px 18px;border-radius:12px;animation:fd .3s;z-index:60}
.cta{text-align:center;padding:40px;color:var(--mut)}.cta .btn{width:auto;padding:12px 28px;margin-top:14px}
@media(max-width:860px){#app{grid-template-columns:1fr}aside{position:static;height:auto;display:flex;overflow-x:auto;gap:4px;padding:10px}.lo{display:none}.nv{white-space:nowrap;width:auto}.g4,.g2,.gq{grid-template-columns:1fr}main{padding:14px}.card{overflow-x:auto}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="gd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7a8b"/><stop offset="1" stop-color="#b4081f"/></linearGradient></defs>
<symbol id="dp" viewBox="0 0 64 64"><path d="M32 3C32 3 9 27 9 41a23 23 0 0046 0C55 27 32 3 32 3z" fill="url(#gd)"/><g fill="none" stroke="#fff" stroke-width="1.8"><ellipse cx="32" cy="40" rx="17" ry="6.5" transform="rotate(-30 32 40)"><animateTransform attributeName="transform" type="rotate" from="-30 32 40" to="330 32 40" dur="8s" repeatCount="indefinite"/></ellipse><ellipse cx="32" cy="40" rx="17" ry="6.5" transform="rotate(30 32 40)"><animateTransform attributeName="transform" type="rotate" from="30 32 40" to="-330 32 40" dur="11s" repeatCount="indefinite"/></ellipse></g><circle cx="32" cy="40" r="4.2" fill="#fff"/></symbol></svg>

<div id="login"><div class="bl" style="width:420px;height:420px;background:#c1121f;left:-120px;top:-100px"></div><div class="bl" style="width:380px;height:380px;background:#4c1d95;right:-80px;bottom:-120px;animation-delay:-5s"></div>
<div class="lw"><svg class="logo" id="lgo" viewBox="0 0 64 64"><use href="#dp"/></svg><h1 class="wm">Q-<i>BLOOD</i></h1><p>Quantum Optimization for Blood Allocation</p>
<div class="gl" id="lc"><input id="u" value="admin" aria-label="ชื่อผู้ใช้" placeholder="ชื่อผู้ใช้"><input id="p" type="password" value="demo1234" aria-label="รหัสผ่าน" placeholder="รหัสผ่าน"><div class="er" id="er"></div><button class="btn" id="go">เข้าสู่ระบบ</button></div></div></div>

<div id="app" hidden><aside><div class="lo wm"><svg viewBox="0 0 64 64"><use href="#dp"/></svg><span>Q-<i>BLOOD</i></span></div><nav id="nv"></nav></aside>
<main><div class="top"><span id="clk"></span><span class="av">A</span>Admin</div><div id="pg"></div></main></div>

<script>
const $=s=>document.querySelector(s),C=['#ff2d46','#4da3ff','#34d399','#fbbf24','#a78bfa'];
const GS=['O+','A+','B+','AB+','O-','A-','B-','AB-'],SH=[.34,.2,.3,.08,.02,.02,.03,.01];
const HS=[{n:'รพ.ประทาย',x:90,y:80,b:30},{n:'รพ.โนนสูง',x:520,y:70,b:28},{n:'รพ.สีคิ้ว',x:70,y:320,b:34},{n:'รพ.ปากช่อง',x:540,y:330,b:22},{n:'รพ.ชัยภูมิ',x:590,y:200,b:26}],CE={n:'ศูนย์รับบริจาค',x:320,y:200};
let sd=7;const R=()=>(sd=sd*16807%2147483647)/2147483647,nm=i=>i<5?HS[i].n:CE.n,fmt=n=>Math.round(n).toLocaleString();
const hist=HS.map((h,i)=>Array.from({length:28},(_,d)=>Math.round(h.b*(1+.22*Math.sin(d*2*Math.PI/7+i))+(R()-.5)*h.b*.2)));
function fc(i,n){const H=hist[i],av=H.reduce((a,b)=>a+b)/28,w=[...Array(7)].map((_,k)=>{const v=H.filter((_,d)=>d%7==k);return v.reduce((a,b)=>a+b)/v.length/av}),m=H.slice(-14).reduce((a,b)=>a+b)/14;return Array.from({length:n},(_,j)=>Math.round(m*w[(28+j)%7]))}
const DM=HS.map((_,i)=>GS.map((_,g)=>Math.round(fc(i,7).reduce((a,b)=>a+b)*SH[g])));
let S;try{S=JSON.parse(localStorage.getItem('qb'))}catch(e){}
if(!S)S={inv:HS.map((h,i)=>GS.map((_,g)=>Math.round(DM[i][g]*(.5+R()*1.1)))),ce:GS.map((_,g)=>Math.round(SH[g]*520*(.7+R()*.6))),th:8,al:[1,1,1],res:null};
const sv=()=>{try{localStorage.setItem('qb',JSON.stringify(S))}catch(e){}};
const D=(a,b)=>{const p=i=>i<5?HS[i]:CE;return Math.hypot(p(a).x-p(b).x,p(a).y-p(b).y)*.25};
function alloc(g,ord){const need=[],sup=[];for(let i=0;i<5;i++){const d=DM[i][g],v=S.inv[i][g]-d-Math.ceil(d*.15);need[i]=Math.max(0,-v);sup[i]=Math.max(0,v)}sup[5]=S.ce[g];
ord=ord||need.map((_,i)=>i).sort((a,b)=>need[b]-need[a]);const mv=[];let tc=0,sh=0;
for(const i of ord){let n=need[i];while(n>0){let b=-1,bd=1e9;for(let j=0;j<6;j++)if(j!=i&&sup[j]>0&&D(j,i)<bd){bd=D(j,i);b=j}if(b<0){sh+=n;break}const m=Math.min(n,sup[b]);sup[b]-=m;n-=m;mv.push([b,i,g,m,bd]);tc+=m*bd*1.2}}return{mv,tc,sh,need}}
const cost=r=>r.tc+r.sh*300;
function sa(g,it){const a=alloc(g,null),idx=a.need.map((_,i)=>i).filter(i=>a.need[i]>0);let cur=idx.slice(),cc=cost(a),best=a,bc=cc,T=cc*.05+1;
for(let k=0;k<it&&idx.length>1;k++){const o=cur.slice(),x=R()*o.length|0,y=R()*o.length|0;[o[x],o[y]]=[o[y],o[x]];const r=alloc(g,o),c=cost(r);if(c<cc||R()<Math.exp((cc-c)/T)){cur=o;cc=c;if(c<bc){bc=c;best=r}}T*=.97}return best}
const add=(o,r)=>{o.mv.push(...r.mv);o.tc+=r.tc;o.sh+=r.sh};
function LC(ser,n,w,h){const mx=Math.max(...ser.flat())*1.15;let s='';for(let g=0;g<=4;g++){const y=10+g*(h-34)/4;s+=`<line x1="34" x2="${w-6}" y1="${y}" y2="${y}" stroke="#ffffff14"/><text x="28" y="${y+3}" text-anchor="end" font-size="9" fill="#8f99b3">${Math.round(mx-g*mx/4)}</text>`}
for(let j=0;j<n;j+=Math.ceil(n/7))s+=`<text x="${34+j*(w-44)/(n-1)}" y="${h-4}" text-anchor="middle" font-size="9" fill="#8f99b3">+${j+1}</text>`;
ser.forEach((v,k)=>s+=`<path class="ln" pathLength="1" style="animation-delay:${k*.15}s" stroke="${C[k]}" d="M${v.map((y,i)=>(34+i*(w-44)/(n-1)).toFixed(1)+','+(10+(h-34)*(1-y/mx)).toFixed(1)).join('L')}"/>`);return `<svg viewBox="0 0 ${w} ${h}">${s}</svg>`}
const lg=a=>`<div style="display:flex;gap:12px;font-size:12px;margin-bottom:6px;flex-wrap:wrap">${a.map((l,i)=>`<span><b style="color:${C[i]}">●</b> ${l}</span>`).join('')}</div>`;
function donut(v,lb){const t=v.reduce((a,b)=>a+b),cl=[...C,'#64748b','#f472b6','#22d3ee','#94a3b8'];let o=0,s='';v.forEach((x,i)=>{const p=x/t*100;s+=`<circle class="dn" cx="50" cy="50" r="40" fill="none" stroke="${cl[i]}" stroke-width="15" stroke-dasharray="${p*2.513} 251.3" stroke-dashoffset="${-o*2.513}" style="animation-delay:${i*.1}s" transform="rotate(-90 50 50)"/>`;o+=p});
return `<div style="display:flex;gap:16px;align-items:center"><svg viewBox="0 0 100 100" width="140">${s}</svg><div style="font-size:12px;line-height:1.8">${lb.slice(0,5).map((l,i)=>`<div><b style="color:${cl[i]}">●</b> ${l} ${Math.round(v[i]/t*100)}%</div>`).join('')}</div></div>`}
const st=(l,n,pre,sub,cl)=>`<div class="card st"><small>${l}</small><b>${pre||''}<span data-n="${n}">0</span></b><div class="${cl||'ok'}">${sub||'&nbsp;'}</div></div>`;
const low=()=>{const a=[];HS.forEach((h,i)=>S.inv[i].forEach((v,g)=>v<S.th&&a.push([h.n,GS[g],v])));return a.sort((x,y)=>x[2]-y[2])};
const sum=r=>({c:cost(r),tr:r.tc,sh:r.sh,n:r.mv.length,km:r.mv.reduce((a,m)=>a+m[4],0)});
const cta=t=>`<div class="card cta">${t}<br><button class="btn" onclick="go('qa')">ไปรันการจำลอง</button></div>`;
const PG={
dash:()=>{const tot=S.inv.flat().reduce((a,b)=>a+b)+S.ce.reduce((a,b)=>a+b),lw=low(),r=S.res&&sum(S.res.qa);
return `<h2 class="t">ภาพรวมระบบ</h2><div class="g g4">${st('เลือดคงเหลือรวม',tot,'','ทุกแห่งรวมศูนย์ฯ')}${st('โรงพยาบาลในเครือข่าย',5,'','เชื่อมต่อครบ')}${st('ต้นทุนขนส่งล่าสุด',r?r.c:0,'฿ ',r?'จากการจำลองรอบล่าสุด':'ยังไม่ได้รันการจำลอง',r?'ok':'bad')}${st('รายการสต็อกต่ำ',S.al[0]?lw.length:0,'',lw.length?'ควรเติมเลือด':'ปกติ',lw.length?'bad':'ok')}</div>
<div class="g g2" style="margin-top:14px"><div class="card"><h3>ความต้องการเลือดที่พยากรณ์ 7 วัน (หน่วย/วัน)</h3>${lg(HS.map(h=>h.n))}${LC(HS.map((_,i)=>fc(i,7)),7,560,230)}</div>
<div class="card"><h3>สัดส่วนกรุ๊ปเลือดคงเหลือ</h3>${donut(GS.map((_,g)=>S.inv.reduce((a,r)=>a+r[g],0)+S.ce[g]),GS)}<h3 style="margin-top:16px">แจ้งเตือนสต็อกต่ำ</h3>${lw.slice(0,4).map(a=>`<div class="kv"><span>${a[0]} ${a[1]}</span><b class="bad">เหลือ ${a[2]}</b></div>`).join('')||'<span class="ok">ไม่มีรายการต่ำกว่าเกณฑ์</span>'}</div></div>`},
inv:()=>`<h2 class="t">คลังเลือด</h2><div class="card"><p style="color:var(--mut);margin-bottom:10px">แก้ตัวเลขในตารางได้โดยตรง ระบบบันทึกอัตโนมัติ ช่องสีแดงคือต่ำกว่าเกณฑ์ (${S.th} หน่วย)</p><div style="overflow-x:auto"><table><thead><tr><th>สถานที่</th>${GS.map(g=>`<th>${g}</th>`).join('')}<th>รวม</th></tr></thead><tbody id="ib">${[...HS,CE].map((h,i)=>{const v=i<5?S.inv[i]:S.ce;return `<tr style="animation-delay:${i*.07}s"><td>${h.n}</td>${v.map((x,g)=>`<td><input type="number" min="0" data-i="${i}" data-g="${g}" value="${x}" class="${i<5&&x<S.th?'lw2':''}" aria-label="${h.n} ${GS[g]}"></td>`).join('')}<td><b id="t${i}">${v.reduce((a,b)=>a+b)}</b></td></tr>`}).join('')}</tbody></table></div></div>`,
fc:()=>`<h2 class="t">AI พยากรณ์ความต้องการเลือด</h2><div class="g g2"><div class="card"><div style="display:flex;gap:10px;max-width:380px"><select id="fh"><option value="7">7 วันข้างหน้า</option><option value="14">14 วันข้างหน้า</option></select><select id="fp"><option value="-1">ทุกโรงพยาบาล</option>${HS.map((h,i)=>`<option value="${i}">${h.n}</option>`).join('')}</select></div><div id="fl"></div><div id="fch"></div><small style="color:var(--mut)">คำนวณจากค่าเฉลี่ย 14 วันล่าสุด ปรับตามรูปแบบรายวันในสัปดาห์ (ข้อมูลย้อนหลัง 28 วันเป็นข้อมูลจำลอง)</small></div><div class="card" id="fs"></div></div>`,
qa:()=>`<h2 class="t">การจำลองและเพิ่มประสิทธิภาพ (QAOA)</h2><div class="g gq"><div class="card"><h3>ตั้งค่า</h3><div class="row"><span>จำนวน Qubits</span><select id="q1"><option>6</option><option>8</option><option>10</option></select></div><div class="row"><span>จำนวน Scenarios</span><select id="q2"><option>8</option><option>16</option><option>32</option></select></div><button class="btn" id="run" style="margin-top:6px">▶ เริ่มรันการจำลอง</button><p style="color:var(--mut);font-size:12px;margin-top:12px;line-height:1.7">ระบบคำนวณการจัดสรรจริงจากคลังเลือดและค่าพยากรณ์ในหน้าก่อนหน้า โดยเทียบวิธี Classical (Greedy) กับตัวค้นหาแบบ Annealing ที่จำลองการทำงานของ QAOA บนคอมพิวเตอร์ปกติ ไม่ได้ใช้ฮาร์ดแวร์ควอนตัมจริง</p></div>
