<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><title>Q-BLOOD</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f9;--card:#fff;--ink:#1b2340;--mut:#7a839c;--red:#d62839;--navy:#1b2447;--line:#e6e9f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1426;--card:#1a2140;--ink:#e8ecf8;--mut:#94a0c0;--line:#2a3256}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans Thai',system-ui,sans-serif;font-size:14px}
[hidden]{display:none!important}
#login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;background:#1a0509;position:relative;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:fl 9s ease-in-out infinite alternate}
@keyframes fl{to{transform:translate(60px,-40px) scale(1.2)}}
.brand{position:relative;color:#fff;padding:12vh 8%;display:flex;flex-direction:column;justify-content:center}
.drop{width:84px;height:84px;animation:pl 2.4s ease-in-out infinite}
@keyframes pl{50%{transform:scale(1.08) translateY(-4px);filter:drop-shadow(0 0 18px #ff4d5e)}}
.brand h1{font-size:46px;margin:12px 0 4px;letter-spacing:1px}.brand h1 b{color:#ff4d5e}
.brand p{opacity:.85;margin:4px 0}
.lbox{position:relative;display:grid;place-items:center;padding:20px}
.lcard{background:#fffffff2;color:#1b2340;border-radius:18px;padding:32px;width:min(380px,100%);box-shadow:0 20px 60px #0008;animation:up .8s .2s both}
@keyframes up{from{opacity:0;transform:translateY(30px)}}
.lcard h2{text-align:center;margin:0 0 4px}.lcard small{display:block;text-align:center;color:#7a839c;margin-bottom:18px}
input,select{width:100%;padding:11px 12px;border:1px solid #d9deea;border-radius:8px;font:inherit;background:#fff;color:#1b2340;margin-bottom:12px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--red);outline-offset:1px}
.btn{width:100%;padding:12px;border:0;border-radius:8px;background:var(--red);color:#fff;font:inherit;font-weight:700;cursor:pointer;transition:.2s}
.btn:hover{background:#b81f2e;transform:translateY(-1px);box-shadow:0 6px 16px #d6283955}
#app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
aside{background:var(--navy);color:#cfd6f0;padding:16px 10px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:8px;color:#fff;font-weight:700;font-size:19px;padding:6px 10px 18px}.logo b{color:#ff4d5e}
.nav{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:9px;cursor:pointer;margin-bottom:4px;transition:.2s;border:0;background:none;color:inherit;font:inherit;width:100%;text-align:left}
.nav:hover{background:#ffffff14;transform:translateX(3px)}.nav.on{background:var(--red);color:#fff}
main{padding:18px 24px;min-width:0}
header{display:flex;justify-content:flex-end;align-items:center;gap:16px;color:var(--mut);font-size:12px;margin-bottom:6px}
.av{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:12px}
h2.t{font-size:20px;margin:6px 0 16px}
#page{animation:fade .45s}@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.g{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1.6fr 1fr}
.card{background:var(--card);border-radius:12px;padding:16px;box-shadow:0 2px 10px #1b234012;min-width:0}
.card h3{font-size:14px;margin:0 0 10px}
.stat{display:flex;gap:12px;align-items:center;transition:.25s}.stat:hover{transform:translateY(-3px)}
.ic{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-size:20px;flex:none}
.stat small{color:var(--mut);display:block}.stat b{font-size:24px}
.up{color:#10a36b;font-size:12px}.dn{color:var(--red);font-size:12px}
svg{max-width:100%;display:block}
.draw{fill:none;stroke-width:2.2;stroke-dasharray:1000;stroke-dashoffset:1000;animation:dr 1.8s ease forwards}@keyframes dr{to{stroke-dashoffset:0}}
.dnut{animation:dnu 1.2s ease both}@keyframes dnu{from{stroke-dasharray:0 251.3}}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th{background:var(--navy);color:#fff;padding:9px;font-weight:500}
.tbl td{padding:9px;text-align:center;border-bottom:1px solid var(--line)}.tbl td:first-child,.tbl th:first-child{text-align:left}
.tbl tbody tr{animation:fade .5s both;transition:.15s}.tbl tbody tr:hover{background:#d628390d}
.low{color:var(--red);font-weight:700}.tot td{font-weight:700;background:#1b244712}
.tabs{display:flex;gap:6px;margin-bottom:14px}.tab{padding:7px 16px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font:inherit;font-size:12px}.tab.on{background:var(--red);color:#fff;border-color:var(--red)}
.bars{display:flex;align-items:flex-end;gap:36px;height:190px;justify-content:center;border-bottom:1px solid var(--line)}
.bar{width:90px;border-radius:6px 6px 0 0;transform-origin:bottom;animation:gr 1.2s cubic-bezier(.2,.8,.2,1) both;position:relative}
@keyframes gr{from{transform:scaleY(0)}}.bar span{position:absolute;top:-22px;width:100%;text-align:center;font-weight:700}
.row{display:grid;grid-template-columns:1fr 130px;gap:8px;align-items:center;font-size:13px}
.steps{display:flex;gap:10px;align-items:center;justify-content:center;margin-bottom:16px;color:var(--mut)}
.sd{display:flex;align-items:center;gap:6px}.sd i{width:26px;height:26px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-style:normal;font-size:12px;transition:.4s}.sd.on{color:var(--ink);font-weight:700}.sd.on i,.sd.ok i{background:var(--red);color:#fff}.sd.ok i{background:#10a36b}
.pb{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0}.pb div{height:100%;width:0;background:linear-gradient(90deg,#d62839,#ff7a86);transition:width .4s}
.job{padding:8px 0;border-bottom:1px solid var(--line);opacity:.4;transition:.4s}.job.on{opacity:1}.job.ok{opacity:1;color:#10a36b}
.pulse{animation:ps 2s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes ps{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.6);opacity:0}}
.tg{width:42px;height:24px;border-radius:12px;background:#c5cadb;position:relative;cursor:pointer;border:0;transition:.25s}.tg:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.25s}.tg.on{background:#2563eb}.tg.on:after{left:21px}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}.kv span:first-child{color:var(--mut)}
.toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;animation:fade .3s}
@media(max-width:860px){#login{grid-template-columns:1fr}.brand{padding:40px 24px}#app{grid-template-columns:1fr}aside{position:static;height:auto;display:flex;overflow-x:auto;gap:4px}.logo{display:none}.nav{white-space:nowrap;width:auto}.g4{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}main{padding:14px}.card{overflow-x:auto}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition:none!important}}
</style></head><body>
<div id="login">
<div class="blob" style="width:420px;height:420px;background:#c1121f;left:-100px;top:-80px"></div>
<div class="blob" style="width:360px;height:360px;background:#5b1a8f;right:10%;bottom:-100px;animation-delay:-4s"></div>
<div class="brand"><svg class="drop" viewBox="0 0 64 64"><path d="M32 4C32 4 10 28 10 41a22 22 0 0044 0C54 28 32 4 32 4z" fill="#e63946"/><path d="M32 28v18M23 37h18" stroke="#fff" stroke-width="5" stroke-linecap="round"/></svg>
<h1>Q-<b>BLOOD</b></h1><p>Quantum Optimization<br>for Blood Allocation</p><p style="margin-top:22px;font-size:17px">"จัดสรรเลือดอย่างชาญฉลาด<br>ด้วยพลังของ AI และ Quantum"</p></div>
<div class="lbox"><div class="lcard"><h2>เข้าสู่ระบบ</h2><small>กรุณาใส่ข้อมูลเพื่อเข้าสู่ระบบ</small>
<input id="u" placeholder="ชื่อผู้ใช้ (Username)" value="admin" aria-label="ชื่อผู้ใช้"><input id="p" type="password" placeholder="รหัสผ่าน (Password)" value="demo1234" aria-label="รหัสผ่าน">
<button class="btn" id="go">เข้าสู่ระบบ</button><small style="margin:14px 0 0;color:#2563eb">ลืมรหัสผ่าน? ติดต่อผู้ดูแลระบบ</small></div></div></div>

<div id="app" hidden><aside><div class="logo"><svg width="24" height="24" viewBox="0 0 64 64"><path d="M32 4C32 4 10 28 10 41a22 22 0 0044 0C54 28 32 4 32 4z" fill="#e63946"/></svg>Q-<b>BLOOD</b></div><nav id="nav"></nav></aside>
<main><header><span id="clk"></span><span class="av">A</span>Admin</header><div id="page"></div></main></div>

<script>
const $=s=>document.querySelector(s),C=['#e63946','#3b82f6','#10b981','#f59e0b','#8b5cf6'];
const NAV=[['dash','⌂','หน้าหลัก'],['inv','▦','คลังเลือด'],['fc','◔','AI Forecast'],['qa','⚛','Quantum Optimization'],['net','◎','แผนที่และการจัดสรร'],['res','▤','รายงานผล'],['set','⚙','ตั้งค่า']];
const H=['รพ.ประทาย','รพ.โนนสูง','รพ.สีคิ้ว','รพ.ปากช่อง','รพ.ชัยภูมิ'],G=['O+','A+','B+','AB+','A-','B-','AB-','O-'];
let timers=[];
function rnd(b,a,n){return Array.from({length:n},(_,i)=>b+Math.sin(i*1.3+b)*a+Math.random()*a)}
function lines(w,h,d,max=250){let s='';for(let g=0;g<=4;g++){let y=10+g*(h-30)/4;s+=`<line x1="36" x2="${w-8}" y1="${y}" y2="${y}" stroke="#8a93a833"/><text x="30" y="${y+3}" text-anchor="end" font-size="9" fill="#8a93a8">${max-g*max/4|0}</text>`}
C.forEach((c,k)=>{const p=rnd(60+k*28,22,d).map((y,i)=>(36+i*(w-52)/(d-1)).toFixed(1)+','+(10+(h-30)*(1-y/max)).toFixed(1));s+=`<path class="draw" pathLength="1000" d="M${p.join('L')}" stroke="${c}" style="animation-delay:${k*.18}s"/>`});
return `<svg viewBox="0 0 ${w} ${h}">${s}</svg>`}
function legend(){return `<div style="font-size:12px;display:flex;gap:12px;margin-bottom:6px">${['A','B','C','D','E'].map((l,i)=>`<span><b style="color:${C[i]}">●</b> ${l}</span>`).join('')}</div>`}
function stat(ic,bg,l,n,pre,sub,cl){return `<div class="card stat"><div class="ic" style="background:${bg}">${ic}</div><div><small>${l}</small><b>${pre||''}<span data-n="${n}">0</span></b><div class="${cl||'up'}">${sub||''}</div></div></div>`}
function donut(){const v=[32,21,18,8,21],cl=[...C];let o=0,s='';v.forEach((p,i)=>{s+=`<circle class="dnut" cx="50" cy="50" r="40" fill="none" stroke="${cl[i]}" stroke-width="16" stroke-dasharray="${p*2.513} 251.3" stroke-dashoffset="${-o*2.513}" style="animation-delay:${i*.15}s" transform="rotate(-90 50 50)"/>`;o+=p});
return `<div style="display:flex;gap:16px;align-items:center"><svg viewBox="0 0 100 100" width="150">${s}</svg><div style="font-size:12px;line-height:1.9">${['O+','A+','B+','AB+','อื่นๆ'].map((l,i)=>`<div><b style="color:${cl[i]}">●</b> ${l} ${v[i]}%</div>`).join('')}</div></div>`}
function bars(a,b,ma){return `<div class="bars"><div class="bar" style="height:${a/ma*165}px;background:#e63946"><span>${a.toLocaleString()}</span></div><div class="bar" style="height:${b/ma*165}px;background:#3b82f6;animation-delay:.25s"><span>${b.toLocaleString()}</span></div></div><div style="display:flex;justify-content:center;gap:90px;margin-top:6px;color:var(--mut)"><span>Classical</span><span>Quantum (QAOA)</span></div>`}
const P={
dash:()=>`<h2 class="t">ภาพรวมระบบ</h2><div class="g g4">${stat('🩸','#fde8ea','เลือดคงเหลือรวม',2480,'','▲ 12% จากสัปดาห์ก่อน')}${stat('🏥','#e3eefe','โรงพยาบาลในเครือข่าย',5,'','เชื่อมต่อครบ')}${stat('🚚','#fde8ea','ต้นทุนขนส่งรวม',48320,'฿ ','▼ 18%')}<div class="card stat"><div class="ic" style="background:#e1f6ec">🛡</div><div><small>สถานะระบบ</small><b style="color:#10a36b">ปลอดภัย</b><div class="up">● พร้อมใช้งาน</div></div></div></div>
<div class="g g2" style="margin-top:14px"><div class="card"><h3>แนวโน้มความต้องการเลือด (7 วันล่าสุด)</h3>${legend()}${lines(560,230,7)}</div><div class="card"><h3>สัดส่วนกรุ๊ปเลือดคงเหลือ</h3>${donut()}</div></div>`,
inv:()=>`<h2 class="t">คลังเลือด</h2><div class="tabs"><button class="tab on">ภาพรวม</button><button class="tab">แยกตามรพ.</button><button class="tab">แยกตามกรุ๊ป</button></div><div class="card"><table class="tbl"><thead><tr><th>โรงพยาบาล</th>${G.map(g=>`<th>${g}</th>`).join('')}<th>รวม</th></tr></thead><tbody>${H.map((h,r)=>{const v=G.map(()=>8+Math.random()*50|0);return `<tr style="animation-delay:${r*.1}s"><td>${h}</td>${v.map(x=>`<td class="${x<14?'low':''}" data-n="${x}">0</td>`).join('')}<td><b data-n="${v.reduce((a,b)=>a+b)}">0</b></td></tr>`}).join('')}</tbody></table><p style="color:var(--mut);font-size:12px">ตัวเลขสีแดงคือสต็อกต่ำกว่าเกณฑ์ที่ควรเติม</p></div>`,
fc:()=>`<h2 class="t">การพยากรณ์ความต้องการเลือด (AI Demand Forecast)</h2><div class="g g2"><div class="card"><div style="display:flex;gap:10px;max-width:360px"><select id="rg"><option>7 วันข้างหน้า</option><option>14 วันข้างหน้า</option></select><select><option>ทั้งหมด</option>${H.map(h=>`<option>${h}</option>`).join('')}</select></div>${legend()}<div id="fch">${lines(560,260,7,250)}</div><small style="color:var(--mut)">* ข้อมูลเป็นการพยากรณ์จากโมเดล AI (LSTM)</small></div>
<div class="card"><h3>สรุปผลการพยากรณ์</h3><div class="kv"><span>ความต้องการรวม (7 วัน)</span><b><span data-n="1482">0</span> หน่วย</b></div><div class="kv"><span>ช่วงที่ต้องการสูงสุด</span><b>228 หน่วย/วัน</b></div><h3 style="margin-top:14px">ปัจจัยที่ใช้ในการพยากรณ์</h3><div class="kv"><span>ข้อมูลการใช้ย้อนหลัง</span><span class="up">✔</span></div><div class="kv"><span>ฤดูกาล / เทศกาล</span><span class="up">✔</span></div><div class="kv"><span>สภาพอากาศ</span><span class="up">✔</span></div><div class="kv"><span>เหตุการณ์พิเศษ</span><span class="up">✔</span></div></div></div>`,
qa:()=>`<h2 class="t">การจำลองและเพิ่มประสิทธิภาพด้วย Quantum (QAOA)</h2><div class="steps"><div class="sd ok" id="s1"><i>✓</i>QUBO</div>—<div class="sd on" id="s2"><i>2</i>QAOA</div>—<div class="sd" id="s3"><i>3</i>ผลลัพธ์</div></div>
<div class="g g2" style="grid-template-columns:1fr 1fr"><div class="card"><h3>ตั้งค่าแบบจำลอง</h3>${[['จำนวนโรงพยาบาล',[5,4,3]],['จำนวน Qubits',[6,8,10]],['จำนวน Scenarios',[8,16,32]],['จำนวน Samples ต่อสถานการณ์',[20000,10000,5000]]].map(x=>`<div class="row"><span>${x[0]}</span><select>${x[1].map(o=>`<option>${o}</option>`).join('')}</select></div>`).join('')}<button class="btn" id="run" style="margin-top:8px">▶ เริ่มรันการจำลอง</button></div>
<div class="card"><h3>สถานะการทำงาน</h3>${['สร้างแบบจำลอง QUBO','ปรับค่าด้วย QAOA (p=1)','วิเคราะห์ผลลัพธ์','เปรียบเทียบกับ Classical'].map((j,i)=>`<div class="job" id="j${i}">○ ${j}</div>`).join('')}<div class="pb"><div id="pg"></div></div><small id="pt" style="color:var(--mut)">พร้อมเริ่มทำงาน</small></div></div>`,
net:()=>{const hs=[[90,70,H[1],185],[330,60,H[2],268],[70,200,H[0],213],[330,210,H[3],216],[430,150,H[4],173]],cx=210,cy=140;let s='<rect width="500" height="270" rx="10" fill="#d9ecdc"/><path d="M0 120Q150 80 250 150T500 110" stroke="#9cc9e8" stroke-width="10" fill="none" opacity=".7"/>';
hs.forEach((h,i)=>{s+=`<path d="M${cx},${cy}L${h[0]},${h[1]}" stroke="#d62839" stroke-width="2" stroke-dasharray="6 5" opacity=".7"/>`;s+=`<circle r="4" fill="#d62839"><animateMotion dur="${2.5+i*.6}s" repeatCount="indefinite" path="M${cx},${cy}L${h[0]},${h[1]}"/></circle>`;s+=`<circle class="pulse" cx="${h[0]}" cy="${h[1]}" r="8" fill="#3b82f6" style="animation-delay:${i*.4}s"/><circle cx="${h[0]}" cy="${h[1]}" r="8" fill="#2563eb" stroke="#fff" stroke-width="2"/><text x="${h[0]}" y="${h[1]-14}" text-anchor="middle" font-size="11" font-weight="700" fill="#1b2340">${h[2]} (${h[3]})</text>`});
s+=`<circle class="pulse" cx="${cx}" cy="${cy}" r="10" fill="#d62839"/><circle cx="${cx}" cy="${cy}" r="10" fill="#d62839" stroke="#fff" stroke-width="3"/><text x="${cx}" y="${cy+26}" text-anchor="middle" font-size="11" font-weight="700" fill="#7b1520">ศูนย์รับบริจาค</text>`;
const pl=[['รพ.ประทาย','รพ.โนนสูง','O+',15],['รพ.ประทาย','รพ.สีคิ้ว','B+',10],['รพ.โนนสูง','รพ.ปากช่อง','A-',8],['รพ.ชัยภูมิ','รพ.ประทาย','AB+',6],['รพ.ปากช่อง','รพ.ชัยภูมิ','B-',5]];
return `<h2 class="t">แผนที่เครือข่ายโรงพยาบาลและเส้นทางการจัดสรร</h2><div class="g g2" style="grid-template-columns:1.3fr 1fr"><div class="card"><svg viewBox="0 0 500 270">${s}</svg></div><div class="card"><h3>แผนการจัดสรร (ตัวอย่าง)</h3><table class="tbl"><thead><tr><th>จาก</th><th>ไป</th><th>กรุ๊ป</th><th>หน่วย</th></tr></thead><tbody>${pl.map((p,i)=>`<tr style="animation-delay:${i*.12}s"><td>${p[0]}</td><td>${p[1]}</td><td>${p[2]}</td><td>${p[3]}</td></tr>`).join('')}</tbody></table><div class="kv" style="margin-top:10px"><span>รวมที่จัดสรร</span><b><span data-n="44">0</span> หน่วย</b></div><div class="kv"><span>ระยะทางรวม</span><b><span data-n="312">0</span> กม.</b></div></div></div>`},
